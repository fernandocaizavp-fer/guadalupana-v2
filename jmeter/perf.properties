# Propiedades para las pruebas de eficiencia (ISO/IEC 25010) del backend Node.js.
# Exporta las columnas PROCESO y PETICION (No. de peticion) al CSV de resultados.
#
# Uso en modo no-GUI (recomendado para la tesis):
#   jmeter -n -q jmeter/perf.properties -t jmeter/01_matricula_196.jmx     -l jmeter/resultados_matricula.csv
#   jmeter -n -q jmeter/perf.properties -t jmeter/02_calificaciones_88.jmx -l jmeter/resultados_calificaciones.csv
#   jmeter -n -q jmeter/perf.properties -t jmeter/03_asistencia_100.jmx    -l jmeter/resultados_asistencia.csv
#
# En modo GUI: copiar la linea sample_variables a <JMETER_HOME>/bin/user.properties y reiniciar JMeter.

sample_variables=PROCESO,PETICION
