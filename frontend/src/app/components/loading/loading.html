@if (loadingService.isLoading()) {
  <div class="loading-overlay" role="status" aria-live="polite">
    <div class="robot">
      <img src="cargando.webp" alt="" width="340" height="340">
    </div>
    <div class="sombra"></div>
    <p class="loading-texto">Cargando, por favor espere...</p>
  </div>
}
